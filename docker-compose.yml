version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: student_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
