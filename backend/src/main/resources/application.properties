# ═══════════════════════════════════════════════════════════════
#  Application Configuration
#  DO NOT commit real passwords. Use application-local.properties
#  for your actual credentials (that file is in .gitignore).
# ═══════════════════════════════════════════════════════════════

# --- Application ---
spring.application.name=student-management-system
server.port=8080

# --- Database Connection ---
# These values are placeholders. Override them in application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yourpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate  → checks schema matches entities (use in production)
# update    → auto-updates schema (safe for development)
# create    → drops and recreates on each start (careful!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Jackson (JSON) ---
# Converts Java dates to readable strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# --- Logging ---
# INFO = normal operations  |  DEBUG = detailed (use only while debugging)
logging.level.root=INFO
logging.level.com.example.studentmanagement=INFO
logging.level.org.springframework.web=INFO

# --- Swagger / OpenAPI ---
# Access the API docs at: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
