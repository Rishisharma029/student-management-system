# =============================================================
#  Test Configuration — Uses H2 in-memory database
# =============================================================
#  Tests run against H2, NOT your real MySQL database.
#  This means tests are isolated and safe — no real data is affected.
#
#  H2 is auto-configured by Spring Boot when it sees the
#  H2 dependency on the classpath during test scope.
# =============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Swagger in tests
springdoc.swagger-ui.enabled=false
